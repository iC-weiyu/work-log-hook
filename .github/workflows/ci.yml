name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\run_tests.ps1

      - name: Run tests with PowerShell Core
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./tests/run_tests.ps1

  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.0

      - name: Run Ruff
        run: python -m ruff check --target-version py310 --select E4,E7,E9,F --no-cache hooks/session_start.py tests/validate_hooks_manifest.py tests/test_validate_hooks_manifest.py

      - name: Validate hooks manifest
        run: python -B tests/validate_hooks_manifest.py hooks/hooks.json

      - name: Test manifest validator
        run: python -B -m unittest discover -s tests -p "test_validate_hooks_manifest.py" -v
